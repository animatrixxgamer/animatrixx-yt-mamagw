[project]
name = "youtube-telegram-bot"
version = "0.1.0"
description = "Telegram bot for managing YouTube channel uploads with TikTok import support"
readme = "README.md"
requires-python = ">=3.12"
# The bot's runtime dependencies live in requirements.txt: it is one script
# (bot.py), not an installable package, and the host installs from that file.
# They used to be listed here for the FastAPI/aiogram/Postgres rewrite in
# `src/`, which has been removed (see legacy-aiogram-app.zip).
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.14",
    "mypy>=1.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
