# Installs ffmpeg in the Railway (Nixpacks) image.
#
# ffmpeg is what lets yt-dlp merge the best video+audio streams (1080p) and what
# the bot uses to write video thumbnails. Without it a download is capped at a
# single progressive MP4 (usually 360p/720p) and thumbnails are skipped.
#
# If your build ever fails here, just delete this file — the bot detects a
# missing ffmpeg at startup ("ffmpeg: missing (720p max, no merges)") and keeps
# working with reduced quality.

[phases.setup]
nixPkgs = ["ffmpeg"]
