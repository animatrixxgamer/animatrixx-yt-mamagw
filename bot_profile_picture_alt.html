<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 512px;
    height: 512px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0a0a;
    overflow: hidden;
  }
  .container {
    width: 512px;
    height: 512px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0a0a0a 0%, #1a0000 50%, #0a0a0a 100%);
  }
  /* Ring */
  .ring {
    width: 320px;
    height: 320px;
    border: 4px solid #ff1a1a;
    border-radius: 50%;
    position: absolute;
    box-shadow: 0 0 40px rgba(255, 26, 26, 0.3), inset 0 0 40px rgba(255, 26, 26, 0.1);
  }
  .ring2 {
    width: 340px;
    height: 340px;
    border: 1px solid rgba(255, 26, 26, 0.2);
    border-radius: 50%;
    position: absolute;
  }
  /* Play icon */
  .play {
    width: 100px;
    height: 100px;
    background: #ff0000;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 50px rgba(255, 0, 0, 0.5);
    position: relative;
    z-index: 2;
    transform: rotate(-5deg);
  }
  .tri {
    width: 0;
    height: 0;
    border-top: 25px solid transparent;
    border-bottom: 25px solid transparent;
    border-left: 44px solid white;
    margin-left: 6px;
  }
  /* FB letters */
  .fb {
    position: absolute;
    bottom: 70px;
    z-index: 2;
    display: flex;
    gap: 4px;
  }
  .fb-letter {
    font-family: 'Arial Black', sans-serif;
    font-size: 28px;
    font-weight: 900;
    color: #ff1a1a;
    text-shadow: 0 0 20px rgba(255, 26, 26, 0.5);
    letter-spacing: 3px;
  }
  /* Speed lines */
  .line {
    position: absolute;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(255, 26, 26, 0.4), transparent);
    z-index: 1;
  }
  .l1 { width: 80px; top: 180px; left: 40px; transform: rotate(-20deg); }
  .l2 { width: 60px; top: 320px; right: 50px; transform: rotate(15deg); }
  .l3 { width: 40px; top: 140px; right: 70px; transform: rotate(-30deg); }
  .l4 { width: 50px; bottom: 160px; left: 60px; transform: rotate(10deg); }
</style>
</head>
<body>
<div class="container">
  <div class="ring2"></div>
  <div class="ring"></div>
  <div class="line l1"></div>
  <div class="line l2"></div>
  <div class="line l3"></div>
  <div class="line l4"></div>
  <div class="play">
    <div class="tri"></div>
  </div>
  <div class="fb">
    <span class="fb-letter">FREEBUFF</span>
  </div>
</div>
</body>
</html>
