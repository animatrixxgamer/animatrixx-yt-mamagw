# Railway build + deploy configuration.
#
# WHY THIS FILE EXISTS
# --------------------
# `bot.py` is the only entry point in this repo. It used to be ambiguous: a root
# `Dockerfile` shipped a *second* bot (the aiogram/FastAPI app in `src/`, which
# reads the same `BOT_TOKEN`) and Railway prefers a root Dockerfile over
# auto-detection, so a deploy could build an image where `bot.py` does not even
# exist. Both the app and that Dockerfile are now gone, and this file pins the
# start command so `Procfile` (`worker: python bot.py`) stays in charge either way.
#
# Settings here override the dashboard ("Configuration defined in code will
# always override values from the dashboard"), which also repairs a service
# still set to builder "Dockerfile Path".
#
# NIXPACKS is still a valid value in railway.com/railway.schema.json and is what
# `nixpacks.toml` (ffmpeg for yt-dlp merges) applies to. Railpack is its
# successor but is still marked EXPERIMENTAL in that schema, so this stays put
# until it is not.
#
# Note: config-as-code itself is deprecated in favour of Infrastructure as Code
# (`.railway/railway.ts`) and stops working for existing services on 2026-12-01.

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python bot.py"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
