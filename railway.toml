# Railway build + deploy configuration.
#
# WHY THIS FILE EXISTS
# --------------------
# This repo also contains a `Dockerfile`, but that one belongs to the *unused*
# `src/` application (async aiogram + PostgreSQL + Redis). It does NOT copy
# `bot.py`, and it starts `uvicorn src.main:app`.
#
# Railway prefers a root `Dockerfile` over auto-detection, so without this file
# a fresh deploy can build an image in which `bot.py` does not even exist —
# "the bot did not work" with no obvious error.
#
# Pinning the builder here keeps `Procfile` (worker: python bot.py) in charge.

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python bot.py"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
