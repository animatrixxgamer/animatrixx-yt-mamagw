<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 512px;
    height: 512px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f0f0f;
    overflow: hidden;
  }
  .container {
    width: 512px;
    height: 512px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 40%, #1a1a2e 0%, #0f0f0f 70%);
    overflow: hidden;
  }
  /* Glow effect */
  .glow {
    position: absolute;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(255, 0, 0, 0.15) 0%, transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
  }
  .glow2 {
    position: absolute;
    width: 250px;
    height: 250px;
    background: radial-gradient(circle, rgba(255, 68, 68, 0.1) 0%, transparent 70%);
    top: 30%;
    left: 60%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
  }
  /* Play button triangle */
  .play-btn {
    width: 120px;
    height: 120px;
    background: #ff0000;
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 60px rgba(255, 0, 0, 0.4), 0 0 120px rgba(255, 0, 0, 0.2);
    position: relative;
    z-index: 2;
    margin-bottom: 20px;
  }
  .play-triangle {
    width: 0;
    height: 0;
    border-top: 30px solid transparent;
    border-bottom: 30px solid transparent;
    border-left: 52px solid white;
    margin-left: 8px;
  }
  /* Upload arrow */
  .upload-arrow {
    position: absolute;
    top: 60px;
    right: 80px;
    z-index: 3;
    font-size: 60px;
    filter: drop-shadow(0 0 10px rgba(0, 200, 255, 0.5));
  }
  /* Bot name */
  .name {
    font-family: 'Segoe UI', Arial, sans-serif;
    font-size: 42px;
    font-weight: 900;
    color: white;
    text-align: center;
    z-index: 2;
    letter-spacing: 2px;
    text-shadow: 0 0 30px rgba(255, 0, 0, 0.3);
    margin-bottom: 8px;
  }
  .name span {
    color: #ff4444;
  }
  /* Subtitle */
  .subtitle {
    font-family: 'Segoe UI', Arial, sans-serif;
    font-size: 18px;
    color: #888;
    text-align: center;
    z-index: 2;
    letter-spacing: 6px;
    text-transform: uppercase;
  }
  /* Decorative dots */
  .dots {
    position: absolute;
    bottom: 40px;
    display: flex;
    gap: 8px;
    z-index: 2;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #333;
  }
  .dot.active { background: #ff4444; }
  /* Corner accents */
  .corner-tl, .corner-br {
    position: absolute;
    width: 60px;
    height: 60px;
    z-index: 2;
  }
  .corner-tl {
    top: 20px;
    left: 20px;
    border-top: 3px solid #ff4444;
    border-left: 3px solid #ff4444;
  }
  .corner-br {
    bottom: 20px;
    right: 20px;
    border-bottom: 3px solid #333;
    border-right: 3px solid #333;
  }
</style>
</head>
<body>
<div class="container">
  <div class="glow"></div>
  <div class="glow2"></div>
  <div class="corner-tl"></div>
  <div class="corner-br"></div>
  <div class="upload-arrow">📤</div>
  <div class="play-btn">
    <div class="play-triangle"></div>
  </div>
  <div class="name">FREE<span>BUFF</span></div>
  <div class="subtitle">YouTube Bot</div>
  <div class="dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot active"></div>
    <div class="dot active"></div>
    <div class="dot active"></div>
  </div>
</div>
</body>
</html>
